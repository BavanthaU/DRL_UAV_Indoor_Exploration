{
  "run_name": "debug_mock_vlm_ppo",
  "seed": 7,
  "device": "cpu",
  "environment": {
    "backend": "debug",
    "exploration_mode": "hierarchical_frontier_guided",
    "num_envs": 2,
    "grid_size": 32,
    "crop_size": 16,
    "max_steps": 48,
    "sensor_radius_cells": 3,
    "success_threshold": 0.60,
    "stuck_steps": 24
  },
  "vlm": {
    "backend": "mock",
    "model_name": null,
    "image_mode": "camera_plus_map",
    "image_size": 64,
    "freeze_vlm_encoder": true,
    "train_vlm_lora": false,
    "latent_dim": 64,
    "memory_type": "gru",
    "memory_steps": 8,
    "use_depth_line": true,
    "use_semantic_line": true,
    "use_map_crop": true,
    "use_frontier_mask": true,
    "depth_line_dim": 64,
    "semantic_line_dim": 64,
    "subgoal_feature_dim": 5,
    "lora_vlm_encoder": {"enabled": false, "rank": 8, "target_modules": []}
  },
  "ppo": {
    "backend": "torch_reference",
    "num_envs": 2,
    "max_iterations": 1,
    "rollout_length": 4,
    "minibatches": 2,
    "learning_epochs": 1,
    "gamma": 0.99,
    "gae_lambda": 0.95,
    "clip_param": 0.2,
    "entropy_coef": 0.01,
    "value_loss_coef": 1.0,
    "learning_rate": 0.0003,
    "max_grad_norm": 1.0,
    "normalize_observations": true,
    "normalize_rewards": true,
    "mixed_precision": false
  },
  "intrinsic": {
    "count": {"beta": 1.0},
    "rnd": {"enabled": true, "beta": 0.05, "hidden_dim": 64, "output_dim": 32, "learning_rate": 0.0001, "reward_clip": 5.0},
    "semantic_novelty": {"beta": 0.02}
  },
  "wandb": {
    "enabled": false,
    "project": "vlm-ppo-uav-exploration",
    "mode": "disabled",
    "tags": ["debug", "mock-vlm"],
    "log_artifacts": true,
    "log_config": true,
    "log_checkpoints": true,
    "log_eval": true,
    "log_profile": true,
    "log_exports": true,
    "log_rollouts": false
  },
  "logging": {"root": "logs/vlm_ppo_explorer"}
}
