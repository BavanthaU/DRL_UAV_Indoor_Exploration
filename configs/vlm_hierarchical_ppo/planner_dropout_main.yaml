{
  "run_name": "B7_planner_dropout_hierarchical_vlm_ppo",
  "method": "learned_hierarchical_vlm_ppo",
  "seed": 7,
  "device": "cuda",
  "environment": {
    "backend": "isaac",
    "scene": {"num_envs": 128},
    "map": {"grid_size": 64, "crop_size": 32, "resolution_m": 0.25, "stuck_steps": 80, "frontier_closed_steps": 12, "min_mapped_cells_for_completion": 64, "return_home_after_s": 480.0, "home_reached_radius_m": 0.75},
    "action": {"max_vx_mps": 1.0, "max_vy_mps": 0.6, "max_yaw_rate_radps": 1.0}
  },
  "vlm": {
    "backend": "mobileclip",
    "model_name": "mobileclip_s2",
    "image_mode": "camera_plus_map",
    "image_size": 224,
    "freeze_vlm_encoder": true,
    "train_vlm_lora": false,
    "latent_dim": 256,
    "memory_type": "gru",
    "memory_steps": 8,
    "use_depth_line": true,
    "use_semantic_line": true,
    "use_map_crop": true,
    "use_frontier_mask": true,
    "depth_line_dim": 64,
    "semantic_line_dim": 64,
    "subgoal_feature_dim": 5,
    "lora_vlm_encoder": {"enabled": false, "rank": 8, "target_modules": []}
  },
  "hierarchy": {
    "variant": "B7_main",
    "max_candidates": 16,
    "candidate_feature_dim": 18,
    "candidate_hidden_dim": 128,
    "candidate_heads": 4,
    "candidate_layers": 1,
    "option_hidden_dim": 256,
    "option_embedding_dim": 32,
    "planner_feature_mode": "features_only",
    "use_privileged_map_for_training": false,
    "use_planner_dropout": true,
    "planner_dropout_prob": 0.2,
    "astar_feature_dropout_prob": 0.2,
    "frontier_candidate_dropout_prob": 0.1,
    "option_interval_steps": 12,
    "safety_shield_enabled": true,
    "safety_min_depth_fraction": 0.08
  },
  "ppo": {
    "backend": "torch_reference",
    "num_envs": 128,
    "max_iterations": 4000,
    "rollout_length": 64,
    "minibatches": 8,
    "learning_epochs": 5,
    "gamma": 0.99,
    "gae_lambda": 0.95,
    "clip_param": 0.2,
    "entropy_coef": 0.01,
    "value_loss_coef": 1.0,
    "learning_rate": 0.0003,
    "max_grad_norm": 1.0,
    "normalize_rewards": true,
    "mixed_precision": true
  },
  "wandb": {
    "enabled": true,
    "project": "vlm-hierarchical-ppo-uav-exploration",
    "mode": "online",
    "group": "B7-main",
    "tags": ["B7", "main", "mobileclip", "planner-dropout"],
    "log_artifacts": true,
    "log_config": true,
    "log_checkpoints": true,
    "log_eval": true,
    "log_profile": true,
    "log_exports": true,
    "log_rollouts": false
  },
  "logging": {"root": "logs/vlm_hierarchical_ppo"}
}
